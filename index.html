<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Ankit Sikder — Interaction & Spatial Designer</title>
    <meta name="description" content="Ankit Sikder is an Interaction Designer, Spatial Designer, and Creative Technologist crafting seamless digital and physical experiences." />
    <meta name="keywords" content="Ankit Sikder, Interaction Designer, Spatial Designer, UX Designer, Portfolio, VR, UI Design, Product Design" />
    <meta name="author" content="Ankit Sikder" />
    <meta name="robots" content="index, follow" />

    <!-- No static canonical: this one file serves every route, and a fixed canonical
         would tell Google every case study is a copy of the home page. -->

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ankidesigns.in/" />
    <meta property="og:title" content="Ankit Sikder — Interaction & Spatial Designer" />
    <meta property="og:description" content="Crafting seamless experiences for people. Interaction Designer, Spatial Designer, and Creative Technologist." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:site_name" content="Ankit Sikder Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ankit Sikder — Interaction & Spatial Designer" />
    <meta name="twitter:description" content="Crafting seamless experiences for people." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logos/Logo Portfolio Dark.svg" />
    <link rel="apple-touch-icon" href="/logos/Logo Portfolio Dark.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#171621" />

    <!-- Fonts: Preconnect for performance -->
    <link rel="preload" href="/fonts/Franchise-Bold-hinted.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Loaded here instead of via @import in CSS so it downloads in parallel with the app CSS -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,400,700,500,600,300&display=swap" rel="stylesheet" />
    <!-- Start downloading the 3D hero scene immediately (Spline's fetch reuses this response).
         Keep the URL identical to the one in src/components/sections/Hero.jsx. -->
    <link rel="preload" href="https://prod.spline.design/AtW72O4zfSpbuuvx/scene.splinecode?v=fresh7" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
